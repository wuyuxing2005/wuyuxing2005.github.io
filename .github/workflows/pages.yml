name: Deploy generated blog
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment:
      name: github-pages
      url: ${{ steps.retry_deploy.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Stage site files
        run: |
          mkdir -p "$RUNNER_TEMP/hexo-site"
          rsync -a --exclude='/.git' --exclude='/.github' ./ "$RUNNER_TEMP/hexo-site/"
      - uses: actions/upload-pages-artifact@v4
        id: artifact
        with:
          path: ${{ runner.temp }}/hexo-site
      - name: Deploy the uploaded artifact by ID
        id: deployment
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          script: &deploy_artifact |
            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('The Pages upload did not return an artifact ID.');
            }
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const transient = status => [404, 409, 429].includes(status) || status >= 500;
            const request = async (route, parameters) => {
              for (let retry = 0; retry < 5; retry++) {
                try {
                  return (await github.request(route, { ...context.repo, ...parameters })).data;
                } catch (error) {
                  if (!transient(error.status) || retry === 4) {
                    throw new Error(`Pages API failed (HTTP ${error.status ?? 'unknown'}).`);
                  }
                  await sleep(4000 * (retry + 1));
                }
              }
            };
            const deployment = await request('POST /repos/{owner}/{repo}/pages/deployments', {
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken(),
            });
            const deployment_id = deployment.id || deployment.status_url?.split('/').pop() || context.sha;
            for (let poll = 0; poll < 30; poll++) {
              await sleep(5000);
              const { status } = await request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', { deployment_id },
              );
              core.info(`Pages deployment: ${status}`);
              if (status === 'succeed') {
                core.setOutput('page_url', deployment.page_url);
                return;
              }
              if (['deployment_failed', 'deployment_perms_error', 'deployment_content_failed',
                   'deployment_cancelled', 'deployment_lost'].includes(status)) {
                throw new Error(`Pages deployment ended with ${status}.`);
              }
            }
            throw new Error('Timed out waiting for GitHub Pages.');
      - name: Upload a fresh artifact for the retry
        if: steps.deployment.outcome == 'failure'
        id: retry_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-retry
          path: ${{ runner.temp }}/hexo-site
      - name: Retry Pages using the new artifact ID
        if: steps.deployment.outcome == 'failure'
        id: retry_deploy
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ steps.retry_artifact.outputs.artifact_id }}
        with:
          script: *deploy_artifact
